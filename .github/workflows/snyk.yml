on:
  workflow_call:

env:
  BUILD_SHA: ${{ github.sha }}

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: 17

      - name: SAST/SCA - Instalar Snyk CLI
        uses: snyk/actions/setup@master

      - name: "SCA - Snyk test (no bloqueante por decision de negocio, resultados en app.snyk.io)"
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-sub-projects --severity-threshold=high

      - name: SCA - Snyk monitor (snapshot en app.snyk.io, no bloquea, todos los sub-proyectos)
        if: always()
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --all-sub-projects

      - name: "SAST - Snyk Code (no bloqueante por decision de negocio, resultados en app.snyk.io)"
        if: always()
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --report --project-name="${{ github.event.repository.name }}" --severity-threshold=high
