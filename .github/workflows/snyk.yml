on:
  workflow_call:

env:
  BUILD_SHA: ${{ github.sha }}
  ACTIONS_ALLOW_UNSECURE_COMMANDS: true

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: "SCA - Snyk test (bloqueante, rompe el job si hay vulnerabilidades, todos los sub-proyectos)"
        uses: snyk/actions/gradle-jdk11@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --all-sub-projects --severity-threshold=high

      - name: SCA - Snyk monitor (snapshot en app.snyk.io, no bloquea, todos los sub-proyectos)
        if: always()
        uses: snyk/actions/gradle-jdk11@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --all-sub-projects

      - name: SAST - Instalar Snyk CLI
        if: always()
        uses: snyk/actions/setup@master

      - name: SAST - Snyk Code (bloqueante, resultados en app.snyk.io)
        if: always()
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --report --project-name="${{ github.event.repository.name }}" --severity-threshold=high
