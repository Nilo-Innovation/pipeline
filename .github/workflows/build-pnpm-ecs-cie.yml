on:
  workflow_call:
    inputs:
      SERVICE_NAME:
        required: true
        type: string
      SERVICE_PORT:
        required: true
        type: string
      PATH_SERVICE:
        required: false
        type: string
    secrets:
      ALB_PROD:
        required: true
      AWS_PROD_ACCOUNT_ID_CIE:
        required: true



env:
  BUILD_SHA: ${{ github.sha }}
  ACTIONS_ALLOW_UNSECURE_COMMANDS: true
  AWS_REGION: us-east-1
  ROLE_DURATION_SECONDS: 1200
  AWS_DEFAULT_OUTPUT: json
  AWS_DEPLOYMENT_ROLE: f1-rt-deploy
  ORGANIZATION: cie
  SERVICE_NAME: ${{inputs.SERVICE_NAME}}
  SERVICE_PORT: ${{inputs.SERVICE_PORT}}
  PATH_SERVICE: ${{ inputs.PATH_SERVICE }}

jobs:
  build:
    permissions:
      id-token: write
      contents: read
    name: Build Docker Images
    #runs-on: [self-hosted, prod]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set PROD environment variables
        if: github.ref == 'refs/heads/master'
        run: |
          echo "::set-env name=STAGE::prod"
          echo "::set-env name=DOCKER_BUILD_TARGET::debug"
          echo "::set-env name=AWS_ACCOUNT_ID::${{ secrets.AWS_PROD_ACCOUNT_ID_CIE }}"
          echo "::set-env name=ALB::${{ secrets.ALB_PROD }}"
          echo "::set-env name=NEWRELIC::${{ secrets.NEWRELIC }}"
          echo "::set-env name=NEXT_PUBLIC_API_URL::https://crm-api-service.f1cie.com"
      # ==========================================================
      # CI PNPM
      # ==========================================================

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with: { version: 9 } 

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24            # mismo Node que la imagen
          cache: pnpm
          cache-dependency-path: ${{ inputs.PATH_SERVICE }}/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ inputs.PATH_SERVICE }}
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/{1}', env.AWS_ACCOUNT_ID, env.AWS_DEPLOYMENT_ROLE) }}
          role-duration-seconds: ${{ env.ROLE_DURATION_SECONDS }}

      - name: 🔎 Validate AWS Identity
        run: aws sts get-caller-identity
      - name: 🔓 Login to Amazon ECR
        if: github.ref == 'refs/heads/master'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/master'
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build, Tag, and Push Image to Amazon ECR
        if: github.ref == 'refs/heads/master'
        env:
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          DOCKER_BUILD_TARGET: ${{ env.DOCKER_BUILD_TARGET }}
          ECR_REPOSITORY: ${{ env.SERVICE_NAME }}-${{ env.STAGE }}
        run: |
          ECR_TARGET="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Building and pushing image..."
          echo "Service Name: ${SERVICE_NAME}"
          echo "Stage: ${STAGE}"
          echo "Path Service: ${PATH_SERVICE}"
          echo "Dockerfile: ${PATH_SERVICE}/Dockerfile"
          echo "ECR Target: ${ECR_TARGET}"

          docker buildx build \
            --platform linux/amd64 \
            -f "${PATH_SERVICE}/Dockerfile" \
            -t "${ECR_TARGET}" \
            --push \
              "${PATH_SERVICE}"
          fi
      - name: Notify Slack on Failure
        if: failure()
        run: |
          curl -X POST --data-urlencode "payload={\"channel\": \"#pipeline-notifications\", \"username\": \"'${{ github.actor }}'\", \"text\": \"Workflow Build Spring Boot Deploy ${{ env.SERVICE_NAME }}-${{ github.ref_name }} failed! See details: '${{ github.workflow }} - https://github.com/Nilo-Innovation/${{ env.SERVICE_NAME }}/actions'.\"}" ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Notify Slack on Success
        if: success()
        run: |
          curl -X POST --data-urlencode "payload={\"channel\": \"#pipeline-notifications\", \"username\": \"'${{ github.actor }}'\", \"text\": \"Workflow Build Spring Boot Deploy ${{ env.SERVICE_NAME }}-${{ github.ref_name }} succeeded! See details: '${{ github.workflow }} - https://github.com/Nilo-Innovation/${{ env.SERVICE_NAME }}/actions'.\"}" ${{ secrets.SLACK_WEBHOOK_URL }}
